name: DevNightDemo
options:
  bundleIdPrefix: com.devnight
  deploymentTarget:
    iOS: "17.0"
targets:
  DevNightDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_CFBundleDisplayName: "DevNightDemo"
      PRODUCT_BUNDLE_IDENTIFIER: com.devnight.DevNightDemo
      SWIFT_VERSION: "5.0"
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
